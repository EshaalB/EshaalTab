<!doctype html>
<html lang="en" class="boot-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html {
        background: #0a0b0e;
      }
      html.boot-pending .app {
        visibility: hidden !important;
      }
      html.boot-pending .app *,
      html.boot-pending .app *::before,
      html.boot-pending .app *::after {
        transition: none !important;
        animation: none !important;
      }
</style>
    <meta name="theme-color" content="#0a0b0e" />
    <meta name="msapplication-navbutton-color" content="#0a0b0e" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>New Tab</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/icon48.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/icon128.png"
    />

    <link
      rel="preload"
      href="fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script src="js/core/boot.js"></script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/search-controls.css" />
    <link rel="stylesheet" href="css/boards.css" />
    <link rel="stylesheet" href="css/popovers.css" />
    <link rel="stylesheet" href="css/notes-palette.css" />
    <link rel="stylesheet" href="css/timer-dialogs.css" />
    <link rel="stylesheet" href="css/interaction-states.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/overrides.css" />
  </head>
  <body>
    <video id="video-bg" autoplay loop muted playsinline></video>
    <div id="photo-bg"></div>
    <div id="wallpaper-overlay"></div>
    <div id="wallpaper-vignette"></div>

    <div class="app">
      <div class="et-topbar">

        <div class="et-top-left" id="topLeft">
          <button class="et-topbar-btn" id="sessionsBtn" data-popover-trigger="sessions" title="Library" aria-label="Library: sessions, read later and workspaces">
          <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          >
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M3 9h18" />
          <path d="M8 4v5" />
          </svg>
          </button>
          <button
          class="et-topbar-btn et-pomo-toggle-btn"
          id="pomoToggleBtn"
          title="Focus timer"
          >
          <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          >

          <path d="M9 2.5h6" stroke-width="2.4" />
          <path d="M12 2.5v2.6" stroke-width="2.4" />
          <path d="M19.1 6.9l-1.6 1.6" stroke-width="2.2" />
          <circle cx="12" cy="13.5" r="7.8" />
          <path d="M12 13.5V9.2" stroke-width="2.4" />
          </svg>
          <span
          class="pomo-toggle-count"
          id="pomoToggleCount"
          style="display: none"
          >0</span
          >
          </button>
        </div>

        <nav class="et-main-tabs" id="mainTabs" aria-label="Views">
          <button
            class="et-main-tab et-main-tab-home"
            data-tab="home"
            title="Home"
            aria-label="Home"
          >
            <svg
              width="21"
              height="21"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2.4 11.2 12 3.2l9.6 8" />
              <path d="M5 10.2V20a1.2 1.2 0 0 0 1.2 1.2h11.6A1.2 1.2 0 0 0 19 20v-9.8" />
              <path d="M9.6 21.2v-6.4a1 1 0 0 1 1-1h2.8a1 1 0 0 1 1 1v6.4" />
            </svg>
          </button>
          <button class="et-main-tab" data-tab="boards">Boards</button>
          <button class="et-main-tab" data-tab="notes">Notes</button>
        </nav>

        <div class="et-top-right" id="topRight">
          <button
          class="et-topbar-btn"
          id="searchSideBtn"
          title="Command palette"
          >
          <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          >

          <rect x="2.6" y="4.6" width="18.8" height="14.8" rx="3" />
          <circle cx="10.6" cy="12" r="2.9" />
          <path d="m12.8 14.2 2.6 2.6" />
          </svg>
          </button>
          <button
          class="et-topbar-btn"
          id="workspaceBtn"
          data-popover-trigger="workspace"
          title="Google Workspace"
          >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="6" cy="6" r="2" />
          <circle cx="12" cy="6" r="2" />
          <circle cx="18" cy="6" r="2" />
          <circle cx="6" cy="12" r="2" />
          <circle cx="12" cy="12" r="2" />
          <circle cx="18" cy="12" r="2" />
          <circle cx="6" cy="18" r="2" />
          <circle cx="12" cy="18" r="2" />
          <circle cx="18" cy="18" r="2" />
          </svg>
          </button>
          <button class="et-topbar-btn" id="topSettingsBtn" title="Settings">
          <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          >
          <circle cx="12" cy="12" r="3" />
          <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          />
          </svg>
          </button>
        </div>
      </div>

      <div class="et-welcome" id="welcomeScreen" hidden>
        <div class="et-welcome-inner">
          <img
            class="et-welcome-mark"
            src="icons/icon128.png"
            alt=""
            width="56"
            height="56"
          />
          <h1 class="et-welcome-title" id="welcomeTitle">
            Hello! What's your name?
          </h1>
          <input
            class="et-welcome-input"
            id="welcomeName"
            type="text"
            maxlength="40"
            autocomplete="given-name"
            spellcheck="false"
            aria-labelledby="welcomeTitle"
            aria-describedby="welcomeHint"
          />
          <p class="et-welcome-hint" id="welcomeHint">
            Please enter your first name or the name you prefer to be called.
          </p>
          <button class="et-welcome-btn" id="welcomeContinue" type="button">
            Continue
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </div>
      </div>

      <section class="et-view et-view-home" id="homeView">
        <div class="et-home-center">
          <div class="et-home-widgets" id="homeWidgets">

            <div class="et-home-clock" id="clockWidget">
              <div class="et-home-meta" id="clockMeta">
                <span class="et-home-corner et-home-corner-left" id="homeCornerLeft">
                  <span class="et-home-date" id="clockDate"></span>
                </span>
                <span class="et-home-corner et-home-corner-right" id="homeCornerRight">
                  <span
                    class="et-weather-inline"
                    id="weatherWidget"
                    style="display: none"
                    title="Click to set city"
                  ></span>
                </span>
              </div>
              <div class="et-home-time" id="clockTime"></div>
              <div class="et-home-greeting" id="clockGreeting"></div>
            </div>
          </div>
          <div id="navSearchBar"></div>
          <div class="et-home-pinned" id="homePinned"></div>
          <div class="et-home-todos" id="homeTodos"></div>
        </div>
      </section>
      <section class="et-view et-view-boards" id="boardsView">
        <div class="et-boards-area" id="boardsArea"></div>
      </section>

      <section class="et-view et-view-notes" id="notesView">
        <div class="et-notes-grid">
          <div class="et-notes-notepad-col">
            <div class="et-notes-binder-strip">
              <span class="et-notes-binder-hole"></span>
              <span class="et-notes-binder-hole"></span>
              <span class="et-notes-binder-hole"></span>
              <span class="et-notes-binder-hole"></span>
              <span class="et-notes-binder-hole"></span>
              <span class="et-notes-binder-hole"></span>
              <span class="et-notes-binder-hole"></span>
              <span class="et-notes-binder-hole"></span>
              <span class="et-notes-binder-hole"></span>
              <span class="et-notes-binder-hole"></span>
            </div>
            <div class="et-notes-header">
              <div
                class="et-notes-tabs"
                id="notesTabs"
                role="tablist"
                aria-label="Saved notes"
              ></div>
              <div class="et-notes-header-actions">
                <button
                  class="et-notes-save-btn"
                  id="notesSaveBtn"
                  title="Save notes now"
                  data-no-tooltip
                >
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"
                    />
                    <polyline points="17 21 17 13 7 13 7 21" />
                    <polyline points="7 3 7 8 15 8" />
                  </svg>
                  Save
                </button>
                <button
                  class="et-notes-export-btn"
                  id="notesExportBtn"
                  title="Export notes as a .txt file"
                  data-no-tooltip
                >
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                  </svg>
                  Export .txt
                </button>
              </div>
            </div>
            <div
              class="et-notes-toolbar"
              id="notesToolbar"
              role="toolbar"
              aria-label="Note actions"
            >
              <div class="et-notes-tool-group" role="group" aria-label="Text style">
                <div class="et-notes-tool-row">
                  <button type="button" class="et-notes-tool" data-note-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold" aria-pressed="false" data-no-tooltip><b>B</b></button>
                  <button type="button" class="et-notes-tool" data-note-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic" aria-pressed="false" data-no-tooltip><i>I</i></button>
                  <button type="button" class="et-notes-tool" data-note-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline" aria-pressed="false" data-no-tooltip><u>U</u></button>
                  <button type="button" class="et-notes-tool" data-note-cmd="heading" title="Heading" aria-label="Heading" aria-pressed="false" data-no-tooltip>H</button>
                  <button type="button" class="et-notes-tool" data-note-cmd="clearFormat" title="Clear formatting" aria-label="Clear formatting" data-no-tooltip>&#10005;</button>
                </div>
              </div>

              <div class="et-notes-tool-group" role="group" aria-label="Colour">
                <div class="et-notes-tool-row">
                  <button type="button" class="et-notes-tool et-note-swatch-btn" data-note-cmd="textColor" id="notesTextColorBtn" title="Text colour" aria-label="Text colour" aria-haspopup="true" aria-expanded="false" data-no-tooltip>
                    <span class="et-note-swatch-glyph" aria-hidden="true">A</span>
                    <span class="et-note-swatch-bar" id="notesTextColorBar" aria-hidden="true"></span>
                  </button>
                  <button type="button" class="et-notes-tool et-note-swatch-btn" data-note-cmd="highlight" id="notesHighlightBtn" title="Highlight" aria-label="Highlight" aria-haspopup="true" aria-expanded="false" data-no-tooltip>
                    <span class="et-note-swatch-glyph et-note-swatch-glyph-hl" aria-hidden="true">A</span>
                    <span class="et-note-swatch-bar" id="notesHighlightBar" aria-hidden="true"></span>
                  </button>
                </div>
              </div>

              <div class="et-notes-tool-group" role="group" aria-label="Lists">
                <div class="et-notes-tool-row">
                  <button type="button" class="et-notes-tool" data-note-cmd="bullet" title="Bullet list" aria-label="Bullet list" aria-pressed="false" data-no-tooltip>&bull;</button>
                  <button type="button" class="et-notes-tool" data-note-cmd="numbered" title="Numbered list" aria-label="Numbered list" aria-pressed="false" data-no-tooltip>1.</button>
                  <button type="button" class="et-notes-tool" data-note-cmd="checklist" title="Checklist" aria-label="Checklist" aria-pressed="false" data-no-tooltip>&#9744;</button>
                </div>
              </div>

              <div class="et-notes-tool-group et-notes-tool-group-end" role="group" aria-label="More">
                <div class="et-notes-tool-row">
                <button
                  type="button"
                  class="et-notes-tool et-notes-more-btn"
                  id="notesMoreBtn"
                  title="More"
                  aria-label="More options"
                  aria-haspopup="menu"
                  aria-expanded="false"
                  data-no-tooltip
                >
                  &#8943;
                </button>
                <div class="et-notes-more-menu" id="notesMoreMenu" role="menu" hidden>
                  <div class="et-notes-more-row">
                    <span class="et-notes-more-label">Text size</span>
                    <div class="et-notes-more-stepper">
                      <button type="button" class="et-notes-tool" data-note-cmd="fontDown" title="Smaller text" aria-label="Smaller text" data-no-tooltip>A&minus;</button>
                      <span class="et-notes-font-val" id="notesFontVal" aria-live="polite">15</span>
                      <button type="button" class="et-notes-tool" data-note-cmd="fontUp" title="Larger text" aria-label="Larger text" data-no-tooltip>A+</button>
                    </div>
                  </div>
                  <div class="et-notes-more-sep" role="separator"></div>
                  <button type="button" class="et-notes-menu-item" role="menuitem" data-note-cmd="cut" data-no-tooltip>Cut<kbd>Ctrl+X</kbd></button>
                  <button type="button" class="et-notes-menu-item" role="menuitem" data-note-cmd="copy" data-no-tooltip>Copy<kbd>Ctrl+C</kbd></button>
                  <button type="button" class="et-notes-menu-item" role="menuitem" data-note-cmd="paste" data-no-tooltip>Paste<kbd>Ctrl+V</kbd></button>
                  <button type="button" class="et-notes-menu-item" role="menuitem" data-note-cmd="selectAll" data-no-tooltip>Select all<kbd>Ctrl+A</kbd></button>
                  <div class="et-notes-more-sep" role="separator"></div>
                  <div class="et-notes-more-row">
                    <span class="et-notes-stats" id="notesStatsBadge">0 words</span>
                  </div>
                </div>
                </div>
              </div>
            </div>
            <div class="et-note-color-menu" id="notesColorMenu" role="menu" hidden></div>
            <div
              class="et-notes-area"
              id="notesArea"
              contenteditable="true"
              role="textbox"
              aria-multiline="true"
              aria-label="Note"
              data-placeholder="Write something…"
              spellcheck="true"
            ></div>
          </div>

          <div class="et-notes-clipboard-col">
            <div class="et-clip-header">
              <div class="clip-title-wrap">
                <span class="et-clip-title">Clipboard</span>
                <span class="et-clip-count" id="clipCountBadge">0 saved</span>
              </div>
            </div>
            <div
              class="et-clip-add-wrap"
              style="display: flex; flex-direction: column; gap: 6px"
            >
              <input
                type="text"
                class="et-clip-input"
                id="clipTitleInput"
                placeholder="Title (optional)"
                style="width: 100%"
              />
              <div style="display: flex; gap: 6px">
                <input
                  type="text"
                  class="et-clip-input"
                  id="clipTextInput"
                  placeholder="Paste…"
                  style="flex: 1"
                />
                <button
                  class="et-clip-add-btn"
                  id="clipAddBtn"
                  title="Save snippet"
                  data-no-tooltip
                >
                  + Add
                </button>
              </div>
            </div>
            <div class="et-clip-list" id="clipList"></div>
          </div>
        </div>
      </section>
    </div>

    <div class="et-pop-sessions" id="sessionsPopover">
      <div class="et-pop-header">
        <div class="et-pop-tabs" role="tablist" aria-label="Library">
          <button
            type="button"
            class="et-pop-tab is-active"
            id="sessionsPaneTab"
            role="tab"
            aria-selected="true"
            aria-controls="sessionsPane"
            data-pane="sessions"
          >
            Sessions
            <span class="et-pop-badge" id="sessionsPopBadge">0</span>
          </button>
          <button
            type="button"
            class="et-pop-tab"
            id="readLaterPaneTab"
            role="tab"
            aria-selected="false"
            aria-controls="readLaterPane"
            data-pane="readLater"
          >
            Read later
            <span class="et-pop-badge" id="readLaterBadge">0</span>
          </button>
          <button
            type="button"
            class="et-pop-tab"
            id="workspacesPaneTab"
            role="tab"
            aria-selected="false"
            aria-controls="workspacesPane"
            data-pane="workspaces"
            tabindex="-1"
          >
            Workspaces
            <span class="et-pop-badge" id="workspacesBadge">0</span>
          </button>
        </div>
      </div>

      <div class="et-pop-pane" id="sessionsPane" role="tabpanel" aria-labelledby="sessionsPaneTab">
        <div class="et-pop-list" id="sessionsPopList"></div>
      </div>

      <div class="et-pop-pane" id="readLaterPane" role="tabpanel" aria-labelledby="readLaterPaneTab" hidden>
        <div class="et-readlater-hint">
          Save the page you are on with the EshaalTab button in your toolbar.
        </div>
        <div class="et-readlater-tools">
          <button type="button" class="et-readlater-tool" id="readLaterToBoard">
            Save unread to a board
          </button>
          <button type="button" class="et-readlater-tool" id="readLaterClearRead">
            Clear read
          </button>
        </div>
        <div class="et-pop-list" id="readLaterList"></div>
      </div>

      <div class="et-pop-pane" id="workspacesPane" role="tabpanel" aria-labelledby="workspacesPaneTab" hidden>
        <form class="et-ws-form" id="workspaceForm">
          <input
            type="text"
            class="et-ws-name"
            id="workspaceName"
            maxlength="60"
            placeholder="Name this workspace, e.g. BSCS Assignment"
            aria-label="Workspace name"
            autocomplete="off"
          />
          <div class="et-ws-form-row">
            <button type="submit" class="et-ws-save" id="workspaceSave">
              Snapshot open tabs
            </button>
            <button type="button" class="et-ws-secondary" id="workspaceToBoard">
              Save as new board
            </button>
          </div>
        </form>
        <div class="et-pop-list" id="workspaceList"></div>
      </div>
    </div>

    <div class="et-pb-panel" id="pinnedBoardsPanel" role="dialog" aria-label="Pinned boards"></div>

    <div class="et-pop-workspace" id="workspacePopover">
      <div class="et-workspace-top">
        <div class="et-workspace-header">
          <span class="et-workspace-title">Apps</span>
        </div>
        <div class="et-workspace-search">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            type="text"
            id="workspaceSearchInput"
            placeholder="Search Google Apps…"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>
      <div class="et-workspace-grid" id="workspaceGrid"></div>
    </div>

    <div
      class="et-search-overlay"
      id="searchOverlay"
      role="dialog"
      aria-modal="true"
      aria-label="Search tabs, bookmarks and history"
    >
      <div class="et-search-modal">
        <div class="et-search-input-wrap">
          <svg
            class="et-search-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Search bookmarks, history, and shortcuts"
            autocomplete="off"
            spellcheck="false"
          />
          <kbd class="et-search-esc-hint">Esc</kbd>
        </div>
        <div class="et-search-results" id="searchResults"></div>
      </div>
    </div>

    <div
      class="et-set-overlay"
      id="sidesheetOverlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sidesheetTitle"
    >
      <div class="et-set-panel" id="sidesheetPanel">
        <div class="et-set-header">
          <span class="et-set-title" id="sidesheetTitle"
            ><img
              class="et-brand-mark"
              src="icons/icon128.png"
              alt=""
              width="22"
              height="22"
            />
            <span>Settings</span></span
          >
          <button
            class="et-set-close-btn"
            id="sidesheetCloseBtn"
            aria-label="Close settings"
          >
            ×
          </button>
        </div>

        <div class="et-set-main">
          <div class="et-set-sidebar">
            <div class="et-set-search-wrap">
              <svg class="et-set-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7" /><path d="m16.5 16.5 4 4" />
              </svg>
              <input
                type="search"
                class="et-set-search"
                id="settingsSearch"
                placeholder="Search settings"
                aria-label="Search settings"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
            <nav class="et-set-nav" id="settingsNav" aria-label="Settings sections"></nav>
          </div>
          <div class="et-set-body" id="sidesheetBody"></div>
        </div>
        <input
          type="file"
          id="fileInput"
          accept="image/*,video/mp4"
          aria-label="Wallpaper image or video file"
          style="display: none"
        />
      </div>
    </div>

    <div
      class="et-pomo-overlay"
      id="pomodoroOverlay"
      role="dialog"
      aria-modal="true"
      aria-label="Pomodoro focus timer"
    >
      <button
        class="et-pomo-close-btn"
        id="pomodoroCloseBtn"
        data-tooltip="Close (Esc)"
        aria-label="Close focus timer"
      >
        &times;
      </button>
      <button class="et-pomo-reset-fab" id="pomoResetBtn" title="Reset (R)">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
      </button>

      <div class="et-pomo-preset-row" id="pomoPresetRow">
        <button class="et-pomo-preset-btn" data-mins="15">15</button>
        <button class="et-pomo-preset-btn active" data-mins="25">25</button>
        <button class="et-pomo-preset-btn" data-mins="45">45</button>
        <button class="et-pomo-preset-btn" data-mins="60">60</button>
        <button
          class="et-pomo-custom-btn"
          id="pomoCustomBtn"
          type="button"
          aria-haspopup="dialog"
          aria-expanded="false"
        >
          Custom
        </button>
      </div>

      <div
        class="et-pomo-wheel-picker"
        id="pomoWheelPicker"
        role="dialog"
        aria-modal="true"
        aria-label="Choose focus duration"
        hidden
      >
        <div class="et-pomo-wheel-header">
          <button type="button" id="pomoWheelCancel">Cancel</button>
          <span>Duration</span>
          <button type="button" id="pomoWheelDone">Done</button>
        </div>
        <div class="et-pomo-wheels">
          <div class="et-pomo-wheel-group">
            <div
              class="et-pomo-wheel"
              id="pomoHoursWheel"
              role="listbox"
              aria-label="Hours"
              tabindex="0"
            ></div>
            <span>hours</span>
          </div>
          <div class="et-pomo-wheel-group">
            <div
              class="et-pomo-wheel"
              id="pomoMinutesWheel"
              role="listbox"
              aria-label="Minutes"
              tabindex="0"
            ></div>
            <span>min</span>
          </div>
          <div class="et-pomo-wheel-selection" aria-hidden="true"></div>
        </div>
      </div>

      <div class="et-flip-container" id="pomoFlipClock" data-no-tooltip>
        <div class="et-flip-card">
          <div class="et-flip-top"><span id="pomoMinTop">25</span></div>
          <div class="et-flip-bottom"><span id="pomoMinBottom">25</span></div>
          <div class="et-flip-seam"></div>
        </div>
        <span class="et-flip-colon">:</span>
        <div class="et-flip-card">
          <div class="et-flip-top"><span id="pomoSecTop">00</span></div>
          <div class="et-flip-bottom"><span id="pomoSecBottom">00</span></div>
          <div class="et-flip-seam"></div>
        </div>
      </div>

      <div class="et-pomo-footer">
        <div
          class="et-pomo-display-switch"
          role="group"
          aria-label="Timer display"
        >
          <button type="button" data-mode="hm" aria-pressed="false">
            Hr : Min
          </button>
          <button
            type="button"
            data-mode="ms"
            class="active"
            aria-pressed="true"
          >
            Min : Sec
          </button>
        </div>
        <span class="et-pomo-status-badge" id="pomoStatusText"
          >Press space to start</span
        >
        <span class="et-pomo-sessions-badge" id="pomoSessionsCount"
          >No sessions yet today</span
        >
      </div>
    </div>

    <div class="et-toast-container" id="toastContainer"></div>

    <script src="js/core/platform.js" defer></script>
    <script src="js/core/storage.js" defer></script>
    <script src="js/core/data.js" defer></script>
    <script src="js/ui/render.js" defer></script>
    <script src="js/ui/timer-notifications.js" defer></script>
    <script src="js/ui/home-widgets.js" defer></script>
    <script src="js/ui/workspace-tasks.js" defer></script>
    <script src="js/ui/sessions.js" defer></script>
    <script src="js/ui/notes-html.js" defer></script>
    <script src="js/ui/notes-home.js" defer></script>
    <script src="js/ui/pinned-boards.js" defer></script>
    <script src="js/core/browserext.js" defer></script>
    <script src="js/ui/search.js" defer></script>
    <script src="js/ui/settings-core.js" defer></script>
    <script src="js/ui/whats-new.js" defer></script>
    <script src="js/main.js" defer></script>
  </body>
</html>
