name: Publish Chrome Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to users immediately (false = upload as a draft only)'
        type: boolean
        default: false

jobs:
  build-and-deploy:
    name: Build and Upload to Chrome Web Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # A mismatch here ships a build the tag does not describe, and the Web Store
      # rejects any upload whose version already exists. Fail loudly, early.
      - name: Verify manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag v$TAG does not match manifest version $MANIFEST"
            exit 1
          fi

      # Built from an explicit allow-list. The old exclude-list packaged every
      # stray file in the repo -- including the checked-in EshaalTab-v*.zip build
      # artifacts, nesting a full copy of the extension inside the upload.
      - name: Create Zip Package
        run: |
          mkdir -p dist/extension
          cp -r manifest.json index.html popup.html favicon.ico \
                icons css js fonts LICENSE dist/extension/
          cd dist/extension && zip -r ../../extension.zip .

      - name: Show package contents
        run: |
          unzip -l extension.zip
          echo "Package size: $(du -h extension.zip | cut -f1)"

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v2.2.0
        with:
          file-path: 'extension.zip'
          extension-id: ${{ secrets.EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: ${{ github.event_name == 'push' || inputs.publish }}
